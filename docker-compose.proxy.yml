services:
  # O Caddy existente em /opt/pegada/app é o único serviço que publica 80/443.
  # O app do Múltiplus entra só na rede exclusiva do proxy (caddy_proxy) para ser
  # alcançável por ele — sem acesso às redes internas de outros projetos.
  app:
    networks:
      internal: {}
      caddy_proxy:
        aliases:
          - multiplus-app

  caddy:
    # Desabilita o Caddy deste projeto quando o proxy compartilhado é usado.
    profiles: ["standalone"]

networks:
  caddy_proxy:
    external: true
